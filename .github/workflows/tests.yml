name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [development, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
      - run: pixi run --locked smoke
      - run: pixi run --locked python -m pytest
